# Sortformer Diarizer with TransformerEncoder (FlexAttention-based) instead of ConformerEncoder.
# Based on sortformer_diarizer_hybrid_loss_4spk-v1.yaml with the encoder replaced by
# TransformerEncoder from nemo/collections/asr/modules/transformer_encoder.py.
# Encoder parameters taken from examples/asr/conf/transformer/transformer_ctc_bpe.yaml.
#
# Example manifest line for training:
# {"audio_filepath": "/path/to/audio01.wav", "offset": 390.83, "duration": 90.00, "text": "-", "num_speakers": 2, "rttm_filepath": "/path/to/audio01.rttm"}
name: "SortFormerDiarizer_TF"
num_workers: 18
batch_size: 8
init_seed: 42
train_seed: null
seed_workers: true

model: 
  sample_rate: 16000
  pil_weight: 0.5
  ats_weight: 0.5
  rank_weight: 0.0 # Weight for PIL-aligned logit ranking on clean exactly-one-speaker frames; raw multiplier, 0 disables
  rank_margin: 0.0 # Additive logit margin against every competing speaker slot
  rank_collar_frames: 0 # Output frames excluded on each side of every target-speaker transition
  speech_bce_weight: 0.0 # Weight for PIL-aligned BCE on non-silent frames; raw multiplier, 0 disables
  speech_bce_collar_frames: 0 # Output frames excluded on each side of target transitions for speech BCE
  interior_focal_weight: 0.0 # Weight for focal BCE on stable interiors of target activity and silence
  interior_focal_gamma: 2.0 # Focal exponent; 0 reduces to BCE over eligible interior frames
  interior_focal_positive_radius: 1 # Positive frame requires activity throughout this +/- output-frame window
  interior_focal_negative_radius: 1 # Negative frame requires silence throughout this +/- output-frame window
  purity_focal_weight: 0.0 # Weight for focal BCE with soft local target-purity weighting
  purity_focal_gamma: 2.0 # Focal exponent for the soft-purity loss
  purity_focal_power: 2.0 # Exponent applied to local target-purity weights
  purity_focal_positive_radius: 1 # Radius of the local target-activity purity window
  purity_focal_negative_radius: 1 # Radius of the local target-silence purity window
  ats_tolerance: 0 # Arrival-time tolerance (output frames) for ATS targets; speakers within this many frames are treated as tied/reorderable (0 = exact sort)
  pairwise_ats_weight: 0.0 # Weight for onset-based pairwise ATS sort loss (raw multiplier, NOT normalized with pil/ats; 0 disables)
  pairwise_ats_temperature: 1.0 # Sharpen preds (T<1) before the pairwise-ATS survival product so faint hedges don't accumulate into a confident onset; 1.0 disables
  self_ats_weight: 0.0 # Weight for self-ATS loss (orders channels by predicted onset; NOT normalized with the others; 0 disables)
  self_ats_metric: bce # Distance for self-ATS loss: 'bce' (default, entropy-floored) or 'mse' (no floor, 0 when self-consistent, gentler gradient)
  self_ats_temperature: 1.0 # Temperature for self-ATS (symmetric on probs+target); <1 sharpens toward 0/1 (less softening, ~1/T more muscle); 1.0 disables
  spkcount_weight: 0.0 # Weight for arrival-count loss (GT-anchored Huber on cumulative #speakers-arrived; counters pairwise-ATS early-blip cheat; raw multiplier; 0 disables)
  spkcount_temperature: 1.0 # Sharpen preds (T<1) before the spkcount survival product so faint hedges don't inflate the arrival count; 1.0 disables
  activity_weight: 0.0 # Weight for 3-class activity CE: silence, single speaker, or overlap (>=2 speakers); 0 disables the loss
  activity_loss_mode: aux_head # 'aux_head' uses a dedicated classifier; 'speaker_preds' derives the 3 classes from existing speaker probabilities
  presence_weight: 0.0 # Weight for PIL-aligned local speaker-presence BCE; penalizes short fake speakers independent of segment duration
  dice_weight: 0.0 # Weight for PIL-aligned soft Dice loss with smooth=1; only target-present speaker channels contribute
  dice_min_target_frames: 6 # Minimum target-positive frames required for a speaker channel to contribute to Dice (15 = 1.2s)
  dice_duration_gamma: 0.5 # Target-duration exponent for eligible-speaker weighting; 0 gives equal speaker weight
  phantom_weight: 0.0 # Weight for hard-negative BCE on PIL-empty speaker channels; each extra phantom channel adds a penalty
  phantom_threshold: 0.25 # Only predictions above this probability contribute to the phantom loss
  phantom_logmeanexp: false # Use temperature-controlled log-mean-exp instead of mean over selected frames
  phantom_logmeanexp_temperature: 0.5 # Lower values focus more strongly on the hardest selected frames
  speaker_existence_weight: 0.0 # Weight for positive BCE on pooled active-frame evidence in real-speaker channels
  speaker_existence_min_frames: 6 # Minimum target-active duration required for a speaker channel
  speaker_existence_temperature: 0.5 # Log-mean-exp temperature for pooling active-frame logits
  speaker_existence_threshold: 1.0 # Channels at or above this pooled confidence receive no existence pressure
  speaker_existence_target: pil # Target assignment used by existence loss: pil or ats
  phantom_entry_weight: 0.0 # Weight for negative BCE in the first chunk where an empty channel exceeds threshold
  phantom_entry_threshold: 0.5 # Threshold choosing first chunk; channels never crossing it fall back to all >phantom_threshold frames
  prearrival_weight: 0.0 # Weight for hard-negative BCE on speaker activity before first PIL target arrival
  prearrival_threshold: 0.25 # Only predictions above this probability contribute to the prearrival loss
  prearrival_grace_frames: 0 # Frames before first target arrival where early predictions are tolerated
  prearrival_logmeanexp: false # Use temperature-controlled log-mean-exp instead of mean over selected frames
  prearrival_logmeanexp_temperature: 0.5 # Lower values focus more strongly on the hardest selected frames
  presence_window_radius: 3 # Presence max-pooling radius d in output frames, using [t-d, t+d] (3 = +/-240ms at 80ms output)
  presence_negative_margin: 0.4 # Locally absent channels are penalized only above this probability, preserving low-confidence hedging
  max_num_of_spks: 4
  output_subsampling_factor: 8
  upsample_smooth_kernel: 9
  upsample_mode: "single"
  upsample_kernel_sizes: [3, 5, 7]
  preenc_proj_dim: 0
  val_upsample_preds: false
  val_upsample_smooth_kernel: 9

  # Add quiet, independently RMS-scaled whole samples from the current batch as babble.
  batch_noise_augmentation:
    probability: 0
    min_num_noise_samples: 2
    max_num_noise_samples: 3
    min_snr_db: 30.0
    max_snr_db: 40.0

  model_defaults:
    fc_d_model: 512
    tf_d_model: 192

  train_ds:
    manifest_filepath: ???
    validate_manifest_paths: False
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    session_len_sec: 90
    soft_label_thres: 0.5
    soft_targets: False
    labels: null
    batch_size: ${batch_size}
    shuffle: True
    num_workers: ${num_workers}
    validation_mode: False
    # Long-session subsegment sampling
    subsegment_mode: True
    subsegment_min_len_sec: 30
    subsegment_two_chunks_rate: 0
    subsegment_min_chunk_len_sec: 10
    subsegment_margin_frames: 10
    subsegment_nspk_bias: 1.0
    subsegment_min_first_spk_frames: 6
    subsegment_boundary_silence_frames: 1
    subsegment_preload_sec: 180
    # lhotse config
    use_lhotse: False
    use_bucketing: True
    num_buckets: 10
    bucket_duration_bins: [10, 20, 30, 40, 50, 60, 70, 80, 90]
    pin_memory: True
    min_duration: 10
    max_duration: 90
    batch_duration: 400
    quadratic_duration: 1200
    bucket_buffer_size: 20000
    shuffle_buffer_size: 10000
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}

  validation_ds:
    manifest_filepath: ???
    is_tarred: False
    tarred_audio_filepaths: null
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    num_speakers: ${model.max_num_of_spks}
    session_len_sec: 90
    soft_label_thres: 0.5
    soft_targets: False
    labels: null
    batch_size: ${batch_size}
    shuffle: False
    num_workers: ${num_workers}
    validation_mode: True
    # lhotse config
    use_lhotse: False
    use_bucketing: False
    drop_last: False
    pin_memory: True
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}
  
  test_ds:
    manifest_filepath: null
    is_tarred: False
    tarred_audio_filepaths: null
    sample_rate: 16000
    num_spks: ${model.max_num_of_spks}
    num_speakers: ${model.max_num_of_spks}
    session_len_sec: 90
    soft_label_thres: 0.5
    soft_targets: False
    labels: null
    batch_size: ${batch_size}
    shuffle: False
    seq_eval_mode: True
    num_workers: ${num_workers}
    validation_mode: True
    # lhotse config
    use_lhotse: False
    use_bucketing: False
    drop_last: False
    pin_memory: True
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    normalize: "per_feature"
    window_size: 0.025
    sample_rate: ${model.sample_rate}
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 0
    time_masks: 0
    freq_width: 1
    time_width: 0.02

  sortformer_modules:
    _target_: nemo.collections.asr.modules.sortformer_modules.SortformerModules
    num_spks: ${model.max_num_of_spks}
    dropout_rate: 0.5
    fc_d_model: ${model.model_defaults.fc_d_model}
    tf_d_model: ${model.model_defaults.tf_d_model}

  encoder:
    _target_: nemo.collections.asr.modules.TransformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 31
    d_model: ${model.model_defaults.fc_d_model}
    n_heads: 8

    # Sub-sampling: feature_stacking is the Transformer-native default; stacking and
    # stacking_norm are also supported.
    subsampling: feature_stacking
    subsampling_factor: 8

    # Feed-forward expansion
    ff_expansion: 4.0

    # Self-attention / positional encoding
    self_attention_model: rel_pos # rel_pos, abs_pos, or no_pos (null)
    pos_emb_max_len: 5000
    xscaling: false

    # Attention block options
    qkv_bias: false
    qk_norm: false
    pre_block_norm: true
    attn_mode: full

    # Regularization
    drop_rate: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0

    sync_max_audio_length: true
  
  transformer_encoder:
    _target_: nemo.collections.asr.modules.transformer.transformer_encoders.TransformerEncoder
    num_layers: 18
    hidden_size: ${model.model_defaults.tf_d_model}
    inner_size: 768
    num_attention_heads: 8
    attn_score_dropout: 0.5
    attn_layer_dropout: 0.5
    ffn_dropout: 0.5
    hidden_act: relu
    pre_ln: False
    pre_ln_final_layer_norm: True
  
  loss: 
    _target_: nemo.collections.asr.losses.bce_loss.BCEWithLogitsLoss
    reduction: mean
    pos_weight: 1.0

  lr: 0.0001
  optim:
    name: adamw
    lr: ${model.lr}
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: InverseSquareRootAnnealing
      warmup_steps: 2500
      warmup_ratio: null
      min_lr: 1e-06

trainer:
  devices: 1
  accelerator: gpu 
  precision: 32
  max_epochs: 800
  max_steps: -1
  num_nodes: 1
  strategy: ddp_find_unused_parameters_true
  accumulate_grad_batches: 1
  deterministic: True
  enable_checkpointing: False
  logger: False
  log_every_n_steps: 1
  val_check_interval: 1.0

exp_manager:
  use_datetime_version: False
  exp_dir: null
  name: ${name}
  resume_if_exists: True
  resume_from_checkpoint: null
  resume_ignore_no_checkpoint: True
  create_tensorboard_logger: True
  create_checkpoint_callback: True
  create_wandb_logger: False
  checkpoint_callback_params:
    monitor: "val_f1_acc"
    mode: "max"
    save_top_k: 9
    every_n_epochs: 1
  wandb_logger_kwargs:
    resume: True
    name: null
    project: null
