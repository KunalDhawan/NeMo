# Sortformer Diarizer is an end-to-end speaker diarization model that is solely based on Transformer-encoder type of architecture.
# Model name convention for Sortformer Diarizer: sortformer_diarizer_<loss_type>_<speaker count limit>-<version>.yaml
# (Example) `sortformer_diarizer_hybrid_loss_4spk-v1.yaml`.
# Sortformer Diarizer model checkpoint (.ckpt) and NeMo file (.nemo) contain Fast Conformer Encoder model (NEST Encoder) and the pre-trained NEST model is loaded along with the Transformer Encoder layers.
# Example: a manifest line for training 
# {"audio_filepath": "/path/to/audio01.wav", "offset": 390.83, "duration": 90.00, "text": "-", "num_speakers": 2, "rttm_filepath": "/path/to/audio01.rttm"}
name: "SortFormerDiarizer"
num_workers: 18
batch_size: 8
init_seed: 42 # Seed used before model construction (controls parameter initialization).
train_seed: null # Optional seed applied right before trainer.fit() to vary sampling/dropout noise.
seed_workers: true # If true, dataloader workers are seeded deterministically by Lightning.

model: 
  sample_rate: 16000
  pil_weight: 0.5 # Weight for Permutation Invariant Loss (PIL) used in training the Sortformer diarizer model
  ats_weight: 0.5 # Weight for Arrival Time Sort (ATS) loss in training the Sortformer diarizer model
  ats_tolerance: 0 # Arrival-time tolerance (output frames) for ATS targets; speakers within this many frames are treated as tied/reorderable (0 = exact sort)
  pairwise_ats_weight: 0.0 # Weight for onset-based pairwise ATS sort loss (raw multiplier, NOT normalized with pil/ats; 0 disables)
  pairwise_ats_temperature: 1.0 # Sharpen preds (T<1) before the pairwise-ATS survival product so faint hedges don't accumulate into a confident onset; 1.0 disables
  self_ats_weight: 0.0 # Weight for self-ATS loss (orders channels by predicted onset; NOT normalized with the others; 0 disables)
  self_ats_metric: bce # Distance for self-ATS loss: 'bce' (default, entropy-floored) or 'mse' (no floor, 0 when self-consistent, gentler gradient)
  self_ats_temperature: 1.0 # Temperature for self-ATS (symmetric on probs+target); <1 sharpens toward 0/1 (less softening, ~1/T more muscle); 1.0 disables
  spkcount_weight: 0.0 # Weight for arrival-count loss (GT-anchored Huber on cumulative #speakers-arrived; counters pairwise-ATS early-blip cheat; raw multiplier; 0 disables)
  spkcount_temperature: 1.0 # Sharpen preds (T<1) before the spkcount survival product so faint hedges don't inflate the arrival count; 1.0 disables
  activity_weight: 0.0 # Weight for 3-class activity CE: silence, single speaker, or overlap (>=2 speakers); 0 disables the head
  presence_weight: 0.0 # Weight for PIL-aligned local speaker-presence BCE; penalizes short fake speakers independent of segment duration
  presence_window_radius: 3 # Presence max-pooling radius d in output frames, using [t-d, t+d] (3 = +/-240ms at 80ms output)
  max_num_of_spks: 4 # Maximum number of speakers per model; currently set to 4
  output_subsampling_factor: 8 # Output resolution factor. Set to 1 for 10ms output (upsampled from encoder's 80ms).
  upsample_smooth_kernel: 9 # Smoothing kernel for repeat/avg-pool upsample paths (must be odd).
  upsample_mode: "single" # Learnable hidden-state upsampling mode when output_subsampling_factor < encoder.subsampling_factor.
  upsample_kernel_sizes: [3, 5, 7] # Per-stage kernels for progressive modes (must be odd).
  preenc_proj_dim: 0 # Projection dim for single_preenc* modes (0 uses tf_d_model).
  val_upsample_preds: false # If true, train at coarse resolution (output_subsampling_factor) but validate at 10ms by upsampling preds.
  val_upsample_smooth_kernel: 9 # Smoothing kernel size for val upsample_preds (must be odd, ignored when val_upsample_preds is false).

  model_defaults:
    fc_d_model: 512 # Hidden dimension size of the Fast-conformer Encoder
    tf_d_model: 192 # Hidden dimension size of the Transformer Encoder

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    session_len_sec: 90 # Maximum session length in seconds
    soft_label_thres: 0.5 # Threshold for binarizing target values; higher values make the model more conservative in predicting speaker activity.
    soft_targets: False # If True, use continuous values as target values when calculating cross-entropy loss
    opus_roundtrip_prob: 0.0 # Probability of in-memory Opus encode/decode per training sample; 0 disables.
    opus_roundtrip_compression_level: null # Higher values produce smaller/more compressed Opus payloads.
    labels: null
    batch_size: ${batch_size}
    shuffle: True
    num_workers: ${num_workers}
    validation_mode: False
    # lhotse config
    use_lhotse: False
    use_bucketing: True
    num_buckets: 10
    bucket_duration_bins: [10, 20, 30, 40, 50, 60, 70, 80, 90]
    pin_memory: True
    min_duration: 10
    max_duration: 90
    batch_duration: 400
    quadratic_duration: 1200
    bucket_buffer_size: 20000
    shuffle_buffer_size: 10000
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}

  validation_ds:
    manifest_filepath: ???
    is_tarred: False
    tarred_audio_filepaths: null
    sample_rate: ${model.sample_rate}
    num_spks: ${model.max_num_of_spks}
    num_speakers: ${model.max_num_of_spks}
    session_len_sec: 90 # Maximum session length in seconds
    soft_label_thres: 0.5 # A threshold value for setting up the binarized labels. The higher the more conservative the model becomes. 
    soft_targets: False
    labels: null
    batch_size: ${batch_size}
    shuffle: False
    num_workers: ${num_workers}
    validation_mode: True
    # lhotse config
    use_lhotse: False
    use_bucketing: False
    drop_last: False
    pin_memory: True
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}
  
  test_ds:
    manifest_filepath: null
    is_tarred: False
    tarred_audio_filepaths: null
    sample_rate: 16000
    num_spks: ${model.max_num_of_spks}
    num_speakers: ${model.max_num_of_spks}
    session_len_sec: 90 # Maximum session length in seconds
    soft_label_thres: 0.5
    soft_targets: False
    labels: null
    batch_size: ${batch_size}
    shuffle: False
    seq_eval_mode: True
    num_workers: ${num_workers}
    validation_mode: True
    # lhotse config
    use_lhotse: False
    use_bucketing: False
    drop_last: False
    pin_memory: True
    window_stride: ${model.preprocessor.window_stride}
    subsampling_factor: ${model.encoder.subsampling_factor}

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    normalize: "per_feature"
    window_size: 0.025
    sample_rate: ${model.sample_rate}
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 0
    time_masks: 0
    freq_width: 1
    time_width: 0.02

  sortformer_modules:
    _target_: nemo.collections.asr.modules.sortformer_modules.SortformerModules
    num_spks: ${model.max_num_of_spks} # Number of speakers per model. This is currently fixed at 4.
    dropout_rate: 0.5 # Dropout rate
    fc_d_model: ${model.model_defaults.fc_d_model}
    tf_d_model: ${model.model_defaults.tf_d_model} # Hidden layer size for linear layers in Sortformer Diarizer module

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 18
    d_model: ${model.model_defaults.fc_d_model}

    # Sub-sampling parameters
    subsampling: dw_striding # vggnet, striding, stacking or stacking_norm, dw_striding
    subsampling_factor: 8 # must be power of 2 for striding and vggnet
    subsampling_conv_channels: 256 # set to -1 to make it equal to the d_model
    causal_downsampling: false
    # Feed forward module's params
    ff_expansion_factor: 4
    # Multi-headed Attention Module's params
    self_attention_model: rel_pos # rel_pos or abs_pos
    n_heads: 8 # may need to be lower for smaller d_models
    # [left, right] specifies the number of steps to be seen from left and right of each step in self-attention
    att_context_size: [-1, -1] # -1 means unlimited context
    att_context_style: regular # regular or chunked_limited
    xscaling: true # scales up the input embeddings by sqrt(d_model)
    untie_biases: true # unties the biases of the TransformerXL layers
    pos_emb_max_len: 5000
    # Convolution module's params
    conv_kernel_size: 9
    conv_norm_type: 'batch_norm' # batch_norm or layer_norm or groupnormN (N specifies the number of groups)
    conv_context_size: null
    # Regularization
    dropout: 0.1 # The dropout used in most of the Conformer Modules
    dropout_pre_encoder: 0.1 # The dropout used before the encoder
    dropout_emb: 0.0 # The dropout used for embeddings
    dropout_att: 0.1 # The dropout for multi-headed attention modules
    # Set to non-zero to enable stochastic depth
    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear  # linear or uniform
    stochastic_depth_start_layer: 1
  
  transformer_encoder:
    _target_: nemo.collections.asr.modules.transformer.transformer_encoders.TransformerEncoder
    num_layers: 18
    hidden_size: ${model.model_defaults.tf_d_model} # Needs to be multiple of num_attention_heads
    inner_size: 768
    num_attention_heads: 8
    attn_score_dropout: 0.5
    attn_layer_dropout: 0.5
    ffn_dropout: 0.5
    hidden_act: relu
    pre_ln: False
    pre_ln_final_layer_norm: True
  
  loss: 
    _target_: nemo.collections.asr.losses.bce_loss.BCELoss
    weight: null # Weight for binary cross-entropy loss. Either `null` or list type input. (e.g. [0.5,0.5])
    reduction: mean

  # Loss-only target softening. Applied exclusively to the targets fed to the BCE loss;
  # F1/accuracy metrics keep using the original hard (0/1) targets, so reported metrics
  # stay comparable. Useful at fine output resolution (output_subsampling_factor near 1),
  # where targets are hard 0/1 with abrupt jumps at speaker onsets/offsets. Disabled by default.
  loss_target_smooth_kernel: 1 # Temporal boundary smoothing window in output frames (odd). 1 disables it (e.g. 5 ~= 50ms at 10ms frames).
  loss_target_smooth_type: gaussian # Smoothing kernel type: 'gaussian' or 'uniform' (ignored when loss_target_smooth_kernel <= 1).
  loss_target_smooth_sigma: null # Gaussian std in frames; null defaults to (kernel-1)/4 (ignored for 'uniform').
  loss_label_smoothing: 0.0 # Clamp loss targets to [eps, 1-eps] to curb BCE overconfidence. 0.0 disables it (e.g. 0.05).

  lr: 0.0001
  optim:
    name: adamw
    lr: ${model.lr}
    # optimizer arguments
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: InverseSquareRootAnnealing
      warmup_steps: 2500
      warmup_ratio: null
      min_lr: 1e-06

trainer:
  devices: 1 # number of gpus (devices)
  accelerator: gpu 
  precision: 32 # 32, bf16, bf16-mixed
  max_epochs: 800
  max_steps: -1 # computed at runtime if not set
  num_nodes: 1
  strategy: ddp_find_unused_parameters_true # Could be "ddp"
  accumulate_grad_batches: 1
  deterministic: True
  enable_checkpointing: False
  logger: False
  log_every_n_steps: 1  # Interval of logging.
  val_check_interval: 1.0  # Set to 0.25 to check 4 times per epoch, or an int for number of iterations

exp_manager:
  use_datetime_version: False
  exp_dir: null
  name: ${name}
  resume_if_exists: True
  resume_from_checkpoint: null # The path to a checkpoint file to continue the training, restores the whole state including the epoch, step, LR schedulers, apex, etc.
  resume_ignore_no_checkpoint: True
  create_tensorboard_logger: True
  create_checkpoint_callback: True
  create_wandb_logger: False
  checkpoint_callback_params:
    monitor: "val_f1_acc"
    mode: "max"
    save_top_k: 9
    every_n_epochs: 1
  wandb_logger_kwargs:
    resume: True
    name: null
    project: null